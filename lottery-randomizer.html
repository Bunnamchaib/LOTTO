<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มหวยตามมีตามเกิด 999</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 4px solid #ff4b5c;
        }
        h1 {
            color: #ff4b5c;
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-shadow: 2px 2px #ffe3e5;
        }
        .date-badge {
            background-color: #fff0f2;
            color: #ff4b5c;
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 25px;
            border: 1px dashed #ff4b5c;
        }
        .ball-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            min-height: 100px;
            align-items: center;
        }
        .ball {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ff6b81, #ff4757);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .ball.show {
            transform: scale(1);
        }
        .btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: all 0.2s;
            outline: none;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .funny-text {
            margin-top: 25px;
            font-style: italic;
            color: #666;
            min-height: 48px;
            font-size: 1.1rem;
        }
        .lucky-god {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lucky-god">🔮✨</div>
    <h1>สุ่มเลขปลดหนี้</h1>
    <div class="date-badge" id="current-date">งวดประจำวันที่: </div>
    
    <div class="ball-container" id="ball-box">
        <!-- Balls will appear here -->
    </div>
    
    <button class="btn" onclick="generateNumbers()">กดสุ่มรับความรวย!</button>
    
    <div class="funny-text" id="quote">กดเลย! หลวงพ่อ AI คัดสรรเลขเด็ดมาให้ท่านแล้ว</div>
</div>

<script>
    // แสดงวันที่ปัจจุบันแบบไทย
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    const today = new Date();
    // เพิ่ม 543 ปีสำหรับ พ.ศ.
    const thaiYear = today.getFullYear() + 543;
    const thaiMonths = [
        "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
        "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
    ];
    document.getElementById('current-date').innerText += ` ${today.getDate()} ${thaiMonths[today.getMonth()]} ${thaiYear}`;

    const quotes = [
        "เลขนี้ซื้อแล้วรวยแน่นอน (ถ้าไม่ถูกห้ามมาตามหาผมนะ)",
        "งวดนี้แหละ! เจ้ามือเตรียมหลั่งน้ำตา",
        "สุ่มด้วยระบบควอนตัมกุมารทอง 4.0",
        "แนะนำให้ซื้อกลับหน้ากลับหลัง และบวกลบหนึ่งเพื่อความชัวร์",
        "เลขนี้ท่านได้แต่ใดมา... สุ่มมั่วล้วนๆ จ้า",
        "ถ้าถูกรางวัลใหญ่ อย่าลืมแบ่งแอดมินบ้างนะสาธุ",
        "มั่นใจมากว่างวดนี้มาแน่! (หมายถึงเจ้าหนี้มาแน่)",
        "เสี่ยงโชควันละนิด จิตแจ่มใส ตอนบ่ายสามลุ้นใจหายใจคว่ำ"
    ];

    function generateNumbers() {
        const ballBox = document.getElementById('ball-box');
        const quoteBox = document.getElementById('quote');
        
        // ล้างค่าเก่า
        ballBox.innerHTML = '';
        quoteBox.innerText = "กำลังคำนวณจากดวงดาว...";
        
        // สุ่มเลข 2 ตัว หรือ 3 ตัว (สลับสุ่มเพื่อความฮา)
        const isThreeDigits = Math.random() > 0.5;
        const count = isThreeDigits ? 3 : 2;
        
        // สุ่มเลขทีละตัว
        for(let i=0; i<count; i++) {
            const num = Math.floor(Math.random() * 10);
            const ball = document.createElement('div');
            ball.className = 'ball';
            ball.innerText = num;
            ballBox.appendChild(ball);
            
            // เอฟเฟกต์ดีเลย์ให้ลูกบอลค่อยๆ เด้งขึ้นมา
            setTimeout(() => {
                ball.classList.add('show');
            }, i * 200);
        }
        
        // เปลี่ยนคำคมขำๆ
        setTimeout(() => {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            quoteBox.innerText = randomQuote;
        }, count * 200);
    }
    
    // เรียกให้ทำงานครั้งแรกเลย
    generateNumbers();
</script>

</body>
</html>
